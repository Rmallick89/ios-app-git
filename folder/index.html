<script data-shine-splash>
  /* App launch → splash first. The first time this page opens in a session (app launch / new browser tab) it hands
     over to the splash, which plays (~2 s) and returns here with location.replace — so Back never shows the splash and
     going "home" later in the session does not replay it. Skipped inside iframes and when storage is blocked.
     #0D1117 = c-cn-black (the splash colour; painted before the redirect so nothing light flashes). */
  (function () {
    try {
      if (window.top !== window) return;
      var s = sessionStorage, k = 'shine-splash:' + location.pathname;
      if (s.getItem(k)) return;
      s.setItem(k, '1'); if (s.getItem(k) !== '1') return;
      var st = document.createElement('style');
      st.textContent = 'html{background:#0D1117!important}body{visibility:hidden!important}';
      document.head.appendChild(st);
      location.replace('splash.html?to=' + encodeURIComponent(location.href));
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script data-ios-nozoom>
  /* iOS Safari auto-zooms the page when a focused field's text is under 16px
     (search modal, filter search). Adding maximum-scale=1 on iOS / iPadOS only
     stops that auto-zoom without touching the design. Pinch-to-zoom still works
     (iOS ignores scale limits for user gestures since iOS 10), and Android —
     which never auto-zooms — keeps its viewport untouched. */
  (function () {
    var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS "desktop" mode
    var m = document.querySelector('meta[name="viewport"]');
    if (iOS && m && !/maximum-scale/.test(m.content)) m.content += ', maximum-scale=1';
  })();
</script>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--surface-neutral-base);color:var(--content-neutral-base);font-family:var(--typeface-family-brand);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
/* ── The whole homepage is one hero: exactly one viewport tall, never scrolls ── */
.screen{height:100vh;height:100dvh;width:100%;max-width:var(--size-layout-mobile-max);margin:0 auto;display:flex;flex-direction:column;
  position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
.stage{flex:1 1 auto;min-height:0;position:relative;container-type:size}
/* App bar */
.appbar{flex:none;height:var(--size-control-xl);display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--spacing-layout-xs);position:relative;z-index:5}
.shine-logo{height:var(--unit-36);width:auto;color:var(--content-neutral-base);display:block}
.ic{display:inline-flex;width:var(--size-icon-md);height:var(--size-icon-md);flex:none}
.ic svg{width:100%;height:100%}
.ic-lg{width:var(--size-icon-lg);height:var(--size-icon-lg)}
.link-explore{display:inline-flex;align-items:center;gap:var(--spacing-inline-sm);height:var(--size-control-sm);padding:0 var(--spacing-inset-md);
  margin-right:calc(-1 * var(--spacing-inset-md));border-radius:var(--size-radius-lg);
  font-size:var(--type-label-lg-size);line-height:var(--type-label-lg-lh);font-weight:var(--typeface-weight-bold);color:var(--content-neutral-muted)}
.link-explore:active{background:var(--surface-neutral-state-hover)}
/* A.02 Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-inline-md);white-space:nowrap;
  font-family:var(--typeface-family-brand);font-weight:var(--typeface-weight-bold);letter-spacing:0;
  border-radius:var(--size-radius-lg);transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease;
  -webkit-user-select:none;user-select:none}
.btn:focus-visible{outline:var(--size-stroke-default) solid var(--stroke-neutral-focus);box-shadow:var(--elevation-focus-default)}
.btn--xl{height:var(--size-control-xl);padding:0 var(--spacing-inset-xxl);font-size:var(--type-label-lg-size);line-height:var(--type-label-lg-lh)}
.btn--lg{height:var(--size-control-lg);padding:0 var(--spacing-inset-xxl);font-size:var(--type-label-lg-size);line-height:var(--type-label-lg-lh)}
.btn--md{height:var(--size-control-md);padding:0 var(--spacing-inset-xl);font-size:var(--type-label-md-size);line-height:var(--type-label-md-lh)}
.btn--block{width:100%}
.btn--primary{background:var(--surface-inverse-base);color:var(--content-on-fill-dark-base)}
.btn--primary:active{background:var(--surface-inverse-state-pressed);box-shadow:var(--elevation-neutral-raised)}
.btn--brand{background:var(--surface-brand-brand-intense);color:var(--content-on-fill-dark-base);box-shadow:var(--elevation-brand-raised)}
.btn--brand:active{background:var(--surface-brand-brand-intense-pressed);box-shadow:var(--elevation-brand-subtle)}
.btn--secondary{background:var(--surface-neutral-raised);color:var(--content-neutral-base);border:var(--size-stroke-default) solid var(--stroke-neutral-base)}
.btn--secondary:active{background:var(--surface-neutral-state-pressed)}
.btn--tertiary{color:var(--content-neutral-brand);padding:0 var(--spacing-inset-sm);height:auto}
@media (hover:hover){
  .btn--primary:hover{background:var(--surface-inverse-state-hover);box-shadow:var(--elevation-neutral-lifted);transform:translateY(var(--motion-lift-up))}
  .btn--brand:hover{background:var(--surface-brand-brand-intense-hover);box-shadow:var(--elevation-brand-lifted);transform:translateY(var(--motion-lift-up))}
  .btn--secondary:hover{background:var(--surface-neutral-state-hover)}
}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-inline-lg)}
.cta-row .btn{padding:0 var(--spacing-inset-lg)}
.legal{font-size:var(--type-body-sm-size);line-height:var(--type-body-sm-lh);color:var(--content-neutral-faded);text-align:center}
.legal a{color:var(--content-neutral-muted);font-weight:var(--typeface-weight-semibold);text-decoration:underline;text-underline-offset:var(--unit-2)}
.foot{flex:none;padding:0 var(--spacing-layout-xs) max(var(--spacing-stack-xl), env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:var(--spacing-stack-md);position:relative;z-index:4}
/* Hero copy */
.h1{font-size:var(--type-display-lg-size);line-height:var(--type-display-lg-lh);letter-spacing:var(--type-display-lg-ls);
  font-weight:var(--typeface-weight-extrabold);text-wrap:balance}
.sub{font-size:var(--type-body-lg-size);line-height:var(--type-body-lg-lh);color:var(--content-neutral-muted);
  font-weight:var(--typeface-weight-medium);text-wrap:balance}
.sub b{color:var(--content-neutral-brand);font-weight:var(--typeface-weight-bold)}
.eyebrow{font-size:var(--type-eyebrow-md-size);line-height:var(--type-eyebrow-md-lh);letter-spacing:var(--type-eyebrow-md-ls);
  font-weight:var(--typeface-weight-bold);text-transform:uppercase;color:var(--content-neutral-faded)}
/* Logos */
.logo{display:block;background:center/contain no-repeat;aspect-ratio:var(--ar);flex:none}
/* Marquee */
@keyframes marquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.marquee{display:flex;width:max-content;animation:marquee var(--dur,40s) linear infinite}
.marquee.rev{animation-direction:reverse}
/* Short phones (iPhone SE / 8, Android 16:9): step the hero headline down one tier */
@media (max-height:720px){
  .h1{font-size:var(--type-display-md-size);line-height:var(--type-display-md-lh);letter-spacing:var(--type-display-md-ls)}
  .sub{font-size:var(--type-body-md-size);line-height:var(--type-body-md-lh)}
  .hide-short{display:none!important}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;transition:none!important}}

/* ── Page ── */
/* ═══════════════════════════════════════════════════════════════════════
   SHINE · SEARCH MODAL  (app component)                       v1.3.0
   "What's next for you?" — keyword · location · experience → Search Jobs
   ───────────────────────────────────────────────────────────────────────
   Ported from the JSRP "Edit search" overlay (jsrp/JSRP-Index.html,
   .li-search-*) and rebuilt as a reusable, page-agnostic component.

   • Every class is prefixed `ssm-` so it can drop into any page (homepage,
     JSRP, JD, profile…) without colliding with that page's own classes.
   • The component carries its OWN scoped token layer (below) so it renders
     identically whatever token vocabulary the host page uses (JSRP uses
     shorthand names like --content-base; the homepage uses canonical ones).
     Values mirror design-system/DESIGN-SYSTEM.md — light theme, mobile
     column of §2.1 / §2.3 (app-only component).
   • Anatomy maps 1:1 to DS atoms: field = A.01 Input (search + select
     variants) · CTA = A.02 Button (Primary · Brand — search is the one
     place brand blue is allowed) · error = A.07 Alert (negative) ·
     toast = A.09 Toast.
   • v1.1.0 — fields use the same A.01 Input spec as the login flow
     (md 44 · white fill · 12px inset · medium-weight placeholder ·
     brand-600 border + 3px brand ring on focus).
   • v1.2.0 — the validation alert sits OUTSIDE the card, 12px below it,
     as a solid floating alert (readable on the scrim); shorter copy.
   • v1.3.0 — toasts go through ShineNotify (app-components/notify) when the
     page has it; .ssm-toast below is only the stand-alone fallback.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Scoped tokens ─────────────────────────────────────────────────── */
.ssm, .ssm-toast {
  /* primitives (definitions only) */
  --ssm-c-brand-500: #1A56FF; --ssm-c-brand-600: #0B3FCC; --ssm-c-brand-700: #0A33A6; --ssm-c-brand-100: #EBF0FF;
  --ssm-c-brand-500-op10: rgba(26,86,255,.10); --ssm-c-brand-500-op12: rgba(26,86,255,.12);
  --ssm-c-brand-500-op18: rgba(26,86,255,.18); --ssm-c-brand-500-op40: rgba(26,86,255,.40); --ssm-c-brand-500-op45: rgba(26,86,255,.45);
  --ssm-c-cn-black: #0D1117; --ssm-c-cn-white: #FFFFFF; --ssm-c-cn-50: #F7F9FB; --ssm-c-cn-100: #EEF1F5; --ssm-c-cn-200: #E4E7EC;
  --ssm-c-cn-300: #C8CED7; --ssm-c-cn-500: #667085; --ssm-c-cn-700: #344054;
  --ssm-c-black-04: rgba(13,17,23,.04); --ssm-c-black-08: rgba(13,17,23,.08); --ssm-c-black-10: rgba(13,17,23,.10);
  --ssm-c-black-20: rgba(13,17,23,.20); --ssm-c-black-30: rgba(13,17,23,.30);
  /* scrim — JSRP's 55% black + 8px blur; deeper than surface.neutral-state.overlay (24%)
     because the modal sits over busy content (logo walls, job cards) */
  --ssm-c-black-55: rgba(13,17,23,.55);
  --ssm-c-wn-50: #FFFDF8; --ssm-c-wn-100: #FAF9F6;
  --ssm-c-red-50: #FEF2F2; --ssm-c-red-200: #FECDCA; --ssm-c-red-600: #B42318; --ssm-c-green-300: #5DD4A1;

  /* semantic (DESIGN-SYSTEM.md §2.2) */
  --ssm-content-base: var(--ssm-c-cn-black);
  --ssm-content-muted: var(--ssm-c-cn-700);
  --ssm-content-faded: var(--ssm-c-cn-500);
  --ssm-content-brand: var(--ssm-c-brand-600);
  --ssm-content-on-fill-dark: var(--ssm-c-cn-white);
  --ssm-content-negative: var(--ssm-c-red-600);
  --ssm-surface-base: var(--ssm-c-wn-100);           /* surface.neutral.base — search-field fill */
  --ssm-surface-raised: var(--ssm-c-cn-white);       /* surface.neutral.raised — card / dropdown */
  --ssm-surface-hover: var(--ssm-c-wn-50);           /* field hover — warm-neutral/50 */
  --ssm-surface-brand: var(--ssm-c-brand-500);
  --ssm-surface-brand-hover: var(--ssm-c-brand-600);
  --ssm-surface-brand-pressed: var(--ssm-c-brand-700);
  --ssm-surface-inverse: var(--ssm-c-cn-black);
  --ssm-surface-negative-subtle: var(--ssm-c-red-50);
  --ssm-surface-scrim: var(--ssm-c-black-55);
  --ssm-stroke-base: var(--ssm-c-cn-200);
  --ssm-stroke-muted: var(--ssm-c-cn-100);
  --ssm-stroke-strong: var(--ssm-c-cn-300);
  --ssm-stroke-focus: var(--ssm-c-brand-500);
  --ssm-stroke-negative: var(--ssm-c-red-200);

  /* typography (§2.1 · mobile) */
  --ssm-font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --ssm-w-regular: 400; --ssm-w-medium: 500; --ssm-w-semibold: 600; --ssm-w-bold: 700; --ssm-w-extrabold: 800;
  --ssm-heading-lg-size: 22px; --ssm-heading-lg-lh: 26px; --ssm-heading-lg-ls: -0.3px;
  --ssm-body-md-size: 14px; --ssm-body-md-lh: 20px;
  --ssm-body-sm-size: 12px; --ssm-body-sm-lh: 18px;
  --ssm-label-lg-size: 14px; --ssm-label-lg-lh: 14px;
  --ssm-eyebrow-sm-size: 10px; --ssm-eyebrow-sm-lh: 10px; --ssm-eyebrow-sm-ls: 1.5px;

  /* spacing (§2.3 · mobile) */
  --ssm-inset-xs: 4px; --ssm-inset-sm: 6px; --ssm-inset-md: 8px; --ssm-inset-lg: 12px; --ssm-inset-xl: 16px;
  --ssm-inline-sm: 4px; --ssm-inline-md: 8px; --ssm-inline-lg: 12px;
  --ssm-stack-xxs: 4px; --ssm-stack-xs: 8px; --ssm-stack-md: 12px; --ssm-stack-lg: 14px; --ssm-stack-xl: 20px;
  --ssm-section-sm: 20px; --ssm-section-md: 24px; --ssm-section-lg: 32px;
  --ssm-layout-xs: 16px;

  /* size (§2.4) */
  --ssm-stroke-thin: 1px; --ssm-stroke-default: 1.5px;
  --ssm-radius-xs: 2px; --ssm-radius-md: 8px; --ssm-radius-lg: 12px; --ssm-radius-2xl: 24px; --ssm-radius-full: 1024px;
  --ssm-icon-xs: 12px; --ssm-icon-sm: 14px; --ssm-icon-md: 16px;
  --ssm-control-close: 32px;                       /* close disc — matches JSRP mobile */
  --ssm-control-sm: 40px; --ssm-control-md: 44px; --ssm-control-lg: 48px;
  --ssm-dropdown-max: 260px;                       /* keeps the list clear of the on-screen keyboard */

  /* elevation (§2.5 · light) */
  --ssm-elev-subtle: 0 1px 2px var(--ssm-c-black-04);
  --ssm-elev-overlay: 0 16px 36px -10px var(--ssm-c-black-30), 0 4px 10px -2px var(--ssm-c-black-10);
  --ssm-elev-modal: 0 24px 60px -12px var(--ssm-c-black-20), 0 6px 16px -6px var(--ssm-c-black-10);
  --ssm-elev-brand-subtle: 0 8px 24px -10px var(--ssm-c-brand-500-op18);
  --ssm-elev-brand-raised: 0 6px 14px -4px var(--ssm-c-brand-500-op45);
  --ssm-elev-brand-lifted: 0 16px 40px -12px var(--ssm-c-brand-500-op40);
  --ssm-elev-focus: 0 0 0 4px var(--ssm-c-brand-500-op10);
  --ssm-elev-field-focus: 0 0 0 3px var(--ssm-c-brand-500-op18);   /* A.01 Input focus ring — same as the login flow */

  /* motion */
  --ssm-ease-out: cubic-bezier(.22,1,.36,1);
  --ssm-dur-fast: 150ms; --ssm-dur: 250ms; --ssm-dur-slow: 320ms;
}

/* ── Overlay (scrim) ───────────────────────────────────────────────── */
.ssm {
  position: fixed; inset: 0; z-index: 9997;
  display: none; flex-direction: column; align-items: center;
  /* card anchors to the TOP so the on-screen keyboard never covers the fields */
  justify-content: flex-start;
  padding: max(var(--ssm-layout-xs), env(safe-area-inset-top)) var(--ssm-layout-xs) var(--ssm-layout-xs);
  background: var(--ssm-surface-scrim);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  opacity: 0; transition: opacity var(--ssm-dur) ease;
  font-family: var(--ssm-font); color: var(--ssm-content-base);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-y: auto; overscroll-behavior: contain;
}
.ssm *, .ssm *::before, .ssm *::after { box-sizing: border-box; }
.ssm.is-mounted { display: flex; }
.ssm.is-open { opacity: 1; }
html.ssm-lock, html.ssm-lock body { overflow: hidden !important; }

/* ── Dialog = card + the alert that floats below it ────────────────── */
.ssm-dialog { position: relative; width: 100%; max-width: 480px; flex: none; }

/* ── Card ──────────────────────────────────────────────────────────── */
.ssm-card {
  position: relative; width: 100%;
  background: var(--ssm-surface-raised);
  border-radius: var(--ssm-radius-2xl);
  padding: var(--ssm-section-md) var(--ssm-section-sm) var(--ssm-section-sm);
  box-shadow: var(--ssm-elev-modal);
  transform: translateY(calc(-1 * var(--ssm-inset-md)));
  transition: transform var(--ssm-dur-slow) var(--ssm-ease-out);
}
.ssm.is-open .ssm-card { transform: none; }
/* brand glow in the top-right corner */
.ssm-card::before {
  content: ""; position: absolute; top: 0; right: 0; width: 160px; height: 130px; pointer-events: none;
  border-top-right-radius: var(--ssm-radius-2xl);
  background: radial-gradient(ellipse at top right, var(--ssm-c-brand-500-op12), transparent 65%);
}
@keyframes ssm-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-3px)} }
.ssm-dialog.is-shaking { animation: ssm-shake 360ms ease; }

/* Close — circular, warm well (Button · icon-only, compact) */
.ssm-close {
  position: absolute; top: var(--ssm-stack-lg); right: var(--ssm-stack-lg); z-index: 2;
  width: var(--ssm-control-close); height: var(--ssm-control-close); padding: 0;
  display: grid; place-items: center; border-radius: var(--ssm-radius-full);
  background: var(--ssm-surface-base); color: var(--ssm-content-muted);
  border: var(--ssm-stroke-thin) solid var(--ssm-stroke-muted);
  cursor: pointer; transition: background var(--ssm-dur-fast), color var(--ssm-dur-fast), border-color var(--ssm-dur-fast);
}
.ssm-close svg { width: var(--ssm-icon-xs); height: var(--ssm-icon-xs); }
.ssm-close:active { background: var(--ssm-c-cn-100); }
.ssm-close:focus-visible { outline: var(--ssm-stroke-default) solid var(--ssm-stroke-focus); box-shadow: var(--ssm-elev-focus); }

/* Eyebrow + heading */
.ssm-eyebrow {
  position: relative; display: inline-flex; align-items: center; gap: var(--ssm-inline-md);
  margin: 0 0 var(--ssm-inset-sm);
  font-size: var(--ssm-eyebrow-sm-size); line-height: var(--ssm-eyebrow-sm-lh); letter-spacing: var(--ssm-eyebrow-sm-ls);
  font-weight: var(--ssm-w-bold); text-transform: uppercase; color: var(--ssm-content-brand);
}
.ssm-eyebrow-dot { width: 6px; height: 6px; border-radius: var(--ssm-radius-full); background: var(--ssm-surface-brand);
  box-shadow: 0 0 0 3px var(--ssm-c-brand-500-op18); flex: none; }
.ssm-title {

window.ShineSearchConfig = { resultsUrl: "jsrp-logout.html" };
/* ═══════════════════════════════════════════════════════════════════════
   SHINE · SEARCH MODAL  (app component)                       v1.3.0
   Pair with search-modal.css. Zero dependencies, no build step.

   Open it from anywhere — three equivalent ways:

   1. Declarative (no JS on the page):
        <button data-shine-search>Explore jobs</button>                    → fresh search
        <button data-shine-search="edit"
                data-ssm-keyword-from="#heroQuery"
                data-ssm-location-from="#heroLocation">Edit search</button>  → prefilled from the page
        <a data-shine-search data-ssm-location="Pune" data-ssm-source="city-page">Search jobs</a>

   2. Programmatic:
        ShineSearch.open({ keyword:'Product Manager', location:'India', source:'jsrp' })
        ShineSearch.close()
        ShineSearch.configure({ resultsUrl:'jsrp.html' })   // app-wide defaults

   3. Drop-in for the existing JSRP contract:
        openSearchOverlay({ keyword, location, experience })              → same as open(), edit mode

   Listen for the result on any page:
        document.addEventListener('shine:search', e => e.detail)
          detail = { keywords:[…], locations:[…], experience, query, location, mode, source }
        Call e.preventDefault() to take over (no default toast / navigation).
   ═══════════════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  if (global.ShineSearch) return;
  var doc = global.document;

  /* ── Icons (24-grid, stroke = currentColor) ───────────────────────── */
  var I = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
    pin:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    caret:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    close:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    alert:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
  };

  /* ── App-wide defaults (override with ShineSearch.configure or window.ShineSearchConfig) ── */
  var DEFAULTS = {
    roles: ['Software Engineer','Senior Software Engineer','Product Manager','Senior Product Manager','Product Designer',
      'UX Designer','UI Designer','Data Analyst','Data Scientist','DevOps Engineer','Frontend Developer','Backend Developer',
      'Full Stack Developer','Marketing Manager','Sales Executive','HR Manager','Business Analyst','Project Manager',
      'QA Engineer','Mobile App Developer','Cloud Engineer','Engineering Manager'],
    locations: ['Bangalore','Mumbai','Delhi NCR','Hyderabad','Chennai','Pune','Kolkata','Ahmedabad','Gurgaon','Noida',
      'Jaipur','Indore','Remote','Hybrid','Work From Home'],
    experienceOptions: ['Fresher','0–1 years','1–3 years','3–5 years','5–7 years','7–10 years','10–15 years','15+ years'],
    minChars: 2,                       // suggestions open after this many typed characters
    eyebrow: 'Find your next role',
    title: "What's next for",          // plain text …
    titleAccent: 'you?',               // … + brand-coloured tail
    submitLabel: 'Search Jobs',
    errorText: 'Add a role, city or experience to search.',
    placeholders: { keyword: 'Job title, skill, or keyword', location: 'Location', experience: 'Experience' },
    resultsUrl: null,                  // set to navigate on submit: url?q=…&loc=…&exp=…
    toast: true,                       // confirmation toast when nothing else handles submit
    autofocus: true,                   // focus the keyword field once the modal settles
    onSubmit: null, onOpen: null, onClose: null
  };
  var cfg = merge({}, DEFAULTS, global.ShineSearchConfig || {});
  var session = cfg;                   // per-open options layered on cfg
  var root, card, dialog, els = {}, lastFocus = null, closeTimer = null, toastTimer = null;
  var SEP = ', ';

  function merge(t) {
    for (var i = 1; i < arguments.length; i++) {
      var s = arguments[i]; if (!s) continue;
      for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) {
        t[k] = (k === 'placeholders' && t[k]) ? merge({}, t[k], s[k]) : s[k];
      }
    }
    return t;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function hl(text, q) {
    if (!q) return esc(text);
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + q.length)) + '</b>' + esc(text.slice(i + q.length));

  function emit(name, detail, cancelable) {

  }
  function list(v) { return (Array.isArray(v) ? v : String(v || '').split(',')).map(function (s) { return String(s).trim(); }).filter(Boolean); }

  /* ── Markup — injected once, on first use ─────────────────────────── */
  function mount() {
    if (root) return;
    root = doc.createElement('div');
    root.className = 'ssm';
    root.setAttribute('aria-hidden', 'true');
    root.innerHTML =
      '<div class="ssm-dialog" role="dialog" aria-modal="true" aria-labelledby="ssm-title">' +
      '<div class="ssm-card">' +
        '<button class="ssm-close" type="button" aria-label="Close search">' + I.close + '</button>' +
        '<p class="ssm-eyebrow"><span class="ssm-eyebrow-dot" aria-hidden="true"></span><span data-ssm="eyebrow"></span></p>' +
        '<h2 class="ssm-title" id="ssm-title"></h2>' +
        '<div class="ssm-form" role="search"><div class="ssm-fields">' +
          combo('keyword', I.search) +
          combo('location', I.pin) +
          '<div class="ssm-field ssm-field--select" data-field="experience" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="ssm-list-experience" aria-labelledby="ssm-lbl-experience ssm-val-experience">' +
            '<span class="ssm-sr" id="ssm-lbl-experience">Experience</span>' +
            '<span class="ssm-field-icon" aria-hidden="true">' + I.clock + '</span>' +
            '<span class="ssm-value is-empty" id="ssm-val-experience"></span>' +
            '<span class="ssm-caret" aria-hidden="true">' + I.caret + '</span>' +
            '<div class="ssm-dropdown" id="ssm-list-experience" role="listbox" aria-label="Total experience"></div>' +
          '</div>' +
        '</div>' +
          '<button class="ssm-submit" type="button">' + I.search + '<span data-ssm="submit"></span></button>' +
        '</div>' +
      '</div>' +
      // validation alert floats just below the card (v1.2.0), still inside the dialog for screen readers
      '<div class="ssm-error-wrap" aria-live="assertive"><div><p class="ssm-error" role="alert">' + I.alert + '<span data-ssm="error"></span></p></div></div>' +
      '</div>';
    doc.body.appendChild(root);
    card = root.querySelector('.ssm-card'); dialog = root.querySelector('.ssm-dialog');
    els = {
      close: root.querySelector('.ssm-close'),
      eyebrow: root.querySelector('[data-ssm="eyebrow"]'),
      title: root.querySelector('.ssm-title'),
      keyword: root.querySelector('#ssm-in-keyword'),
      location: root.querySelector('#ssm-in-location'),
      expField: root.querySelector('[data-field="experience"]'),
      expValue: root.querySelector('#ssm-val-experience'),
      expList: root.querySelector('#ssm-list-experience'),
      errWrap: root.querySelector('.ssm-error-wrap'),
      errText: root.querySelector('[data-ssm="error"]'),
      submit: root.querySelector('.ssm-submit'),
      submitText: root.querySelector('[data-ssm="submit"]')
    };
    wire();
  }
  function combo(name, icon) {
    var label = name === 'keyword' ? 'Job title, skill, or keyword' : 'Location';
    return '<div class="ssm-field" data-field="' + name + '">' +
      '<label class="ssm-sr" for="ssm-in-' + name + '">' + label + '</label>' +
      '<span class="ssm-field-icon" aria-hidden="true">' + icon + '</span>' +
      '<input class="ssm-input" id="ssm-in-' + name + '" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search"' +
        ' role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ssm-list-' + name + '" />' +
      '<div class="ssm-dropdown" id="ssm-list-' + name + '" role="listbox" aria-label="' + label + ' suggestions"></div>' +
    '</div>';
  }

  /* ── Behaviour ────────────────────────────────────────────────────── */
  function fields() { return root.querySelectorAll('.ssm-field'); }
  function closeDropdowns(except) {
    Array.prototype.forEach.call(fields(), function (f) {
      if (f === except) return;
      f.classList.remove('is-open');
      var ctl = f.querySelector('[role="combobox"]') || f;
      ctl.setAttribute('aria-expanded', 'false');
      ctl.removeAttribute('aria-activedescendant');
    });
  }
  function closeField(f) {
    f.classList.remove('is-open');
    var ctl = f.querySelector('[role="combobox"]') || f;
    ctl.setAttribute('aria-expanded', 'false'); ctl.removeAttribute('aria-activedescendant');
  }
  function openDropdown(f) {
    closeDropdowns(f);
    f.classList.add('is-open');
    (f.querySelector('[role="combobox"]') || f).setAttribute('aria-expanded', 'true');
  }
  function showError() {
    els.errWrap.classList.add('is-shown');
    dialog.classList.remove('is-shaking'); void dialog.offsetWidth; dialog.classList.add('is-shaking');
    setTimeout(function () { dialog.classList.remove('is-shaking'); }, 400);
  }
  function hideError() { els.errWrap.classList.remove('is-shown'); }

  // keyboard highlight inside an open list
  function move(listEl, ctl, dir) {
    var opts = listEl.querySelectorAll('.ssm-option'); if (!opts.length) return;
    var cur = listEl.querySelector('.ssm-option.is-active'), i = Array.prototype.indexOf.call(opts, cur);
    if (cur) cur.classList.remove('is-active');
    i = i < 0 ? (dir > 0 ? 0 : opts.length - 1) : (i + dir + opts.length) % opts.length;
    opts[i].classList.add('is-active'); opts[i].scrollIntoView({ block: 'nearest' });
    ctl.setAttribute('aria-activedescendant', opts[i].id);
  }

  function setupCombo(name, getOptions, icon) {
