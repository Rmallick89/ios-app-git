/* COMPONENT · buttons v1.3.0 — verbatim copy of App-components/atoms/buttons/buttons.css */
/* ═══════════════════════════════════════════════════════════════════════
   SHINE · BUTTONS  (app component · App-login · atoms/)          v1.3.0
   Every button in the logged-in app: four types × two tones, four sizes, with an optional icon or icon only.
   Built on design-system A.02 Button (component-system.md) and the buttons used on Home, My Jobs, Docket and
   Profile (cards, sheets and the top app bar). "Brand" here is the app's black (A.02 Primary · Neutral) — brand
   blue is the one exception tone, .btn--accent (A.02 Primary · Brand), and it belongs to Search Jobs alone.

     type          brand (black, default)                    destructive (.btn--destructive)
     ─────────────────────────────────────────────────────────────────────────────────────────────
     Primary       [■ Apply now ]  black fill · white text    [■ Remove ]  red fill · white text
     Secondary     [□ View      ]  warm white · grey edge     [□ Remove ]  warm white · red edge · red text
     Muted         [▤ Filters   ]  grey fill · black text     [▤ Remove ]  pale red fill · red text
     Link            Job details   text only · black            Remove      text only · red
     exception     Primary + .btn--accent  [● Search Jobs ]  brand-blue fill + blue glow — search only (A.02 Primary · Brand)

   Classes
     .btn                                   base — always
     .btn--primary | --secondary | --muted | --link            type (pick one)
     .btn--destructive                      tone (default: brand = black)
     .btn--accent                           Primary only: brand blue + glow — the top bar's Search Jobs, nothing else
     .btn--sm 40 | --md 44 (default) | --lg 48 | --xl 56       size (A.02)
     .btn--icon                             icon only: square, glyph only, aria-label required
     .btn--icon-lg                          icon only, navigation glyph 20 at sm (menu, back) — action glyphs stay 16
     .btn--block                            full width            .btn--fill  shares a row (flex 1, padding 12)
     .btn--flush                            Link only: pulls the text / glyph onto the content edge (margin = −padding)
     .btn--pill                             fully round — bar / navigation buttons only (README › Pill buttons)
     .btn--on-dark                          Primary or Muted on a dark surface (white fill, black text)
     [aria-pressed="true"]                  toggle on (bookmark saved): brand-subtle fill + brand glyph
     [aria-haspopup] + [aria-expanded]      opens a sheet / menu (status, sort): trailing chevron, expanded while open
     :disabled / [aria-disabled="true"]     disabled · [aria-busy="true"] + .btn-spinner  loading
     [data-state="hover|pressed|focus"]     shows a state statically — guidelines and screenshots only
   Anatomy: [leading svg] label [trailing svg | .badge] — gap spacing.inline.md 8 (badge 12); icons inherit the text
   colour; icon-only glyphs are content.neutral.muted (A.02 Icon-only), except on Muted (it has a fill, so the
   glyph keeps content.neutral.base). Hover exists only with a mouse or trackpad (@media (hover: hover)) — on a
   phone a button shows rest, pressed, focus (keyboard / switch access), disabled and loading, so its REST look must
   read as a button on its own. The edge is an inset shadow, never a border,
   so 1.5 px renders as 1.5 px on Android too (Chromium floors border widths to whole pixels).

   ▶ BEFORE CHANGING IT: read README.md here and component-system.md A.02. Semantic tokens only.
   ═══════════════════════════════════════════════════════════════════════ */

.btn {
  /* COLOUR — DESIGN-SYSTEM.md §2.2 (light) */
  --btn-inverse: #0D1117;                   /* surface.inverse.base — primary fill */
  --btn-inverse-hover: #344054;             /* surface.inverse-state.hover */
  --btn-inverse-pressed: #4A5260;           /* surface.inverse-state.pressed */
  --btn-on-fill: #FFFFFF;                   /* primary text: content.on-fill-dark.base (light) → content.inverse.base (dark) */
  --btn-on-intense: #FFFFFF;                /* content.on-fill-dark.base — text on red; the same in both themes */
  --btn-ink: #0D1117;                       /* content.neutral.base */
  --btn-ink-muted: #344054;                 /* content.neutral.muted — icon-only glyph (A.02 Icon-only) */
  --btn-base: #FAF9F6;                      /* surface.neutral.base — secondary fill (warm white) */
  --btn-muted: #EEF1F5;                     /* surface.neutral.muted — muted fill */
  --btn-state-hover: #EEF1F5;               /* surface.neutral-state.hover */
  --btn-state-pressed: #E4E7EC;             /* surface.neutral-state.pressed */
  --btn-stroke: #E4E7EC;                    /* stroke.neutral.base — secondary edge */
  --btn-neg: #B42318;                       /* surface.status.negative-intense (red/600 in both themes) */
  --btn-neg-text: #B42318;                  /* content.status.negative */
  --btn-neg-stroke: #B42318;                /* stroke.status.negative */
  --btn-neg-hover: #8B1A14;                 /* surface.status.negative-intense-hover — hover and pressed (as the sheet) */
  --btn-neg-subtle: #FEF2F2;                /* surface.status.negative-subtle */
  --btn-neg-subtle-hover: #FEE4E4;          /* surface.status.negative-subtle-hover (PROPOSED · red/100) */
  --btn-brand-subtle: #EBF0FF;              /* surface.brand.brand-subtle — toggle on */
  --btn-brand: #0B3FCC;                     /* content.neutral.brand — toggle on glyph */
  --btn-disabled-bg: rgba(13, 17, 23, .08); /* stroke.neutral.disabled (black-25) */
  --btn-disabled-fg: rgba(13, 17, 23, .36); /* content.neutral.disabled (black-75) */
  --btn-focus: #1A56FF;                     /* stroke.neutral.focus */
  /* ELEVATION — §2.5 */
  --btn-lifted: 0 4px 12px rgba(13, 17, 23, .08), 0 2px 4px rgba(13, 17, 23, .04);   /* elevation.neutral.lifted — filled · hover */
  --btn-raised-sh: 0 1px 3px rgba(13, 17, 23, .08), 0 1px 2px rgba(13, 17, 23, .04); /* elevation.neutral.raised — filled · pressed */
  --btn-ring: 0 0 0 4px rgba(26, 86, 255, .10);                                       /* elevation.focus.default */
  /* ON A DARK SURFACE — the Profile hero is dark in both themes, so these never flip */
  --btn-on-dark-bg: #FFFFFF;                /* cool-neutral/white */
  --btn-on-dark-fg: #0D1117;                /* cool-neutral/black */
  --btn-on-dark-hover: #EEF1F5;             /* cool-neutral/100 */
  --btn-on-dark-pressed: #E4E7EC;           /* cool-neutral/200 */
  --btn-on-dark-focus: #7EA3FF;             /* brand/300 — the focus outline that reads on dark */
  /* EXCEPTION TONE · .btn--accent (A.02 Primary · Brand — search only); the same blue in both themes */
  --btn-accent: #1A56FF;                    /* surface.brand.brand-intense · brand/500 */
  --btn-accent-hover: #0B3FCC;              /* surface.brand.brand-intense-hover · brand/600 */
  --btn-accent-pressed: #0A33A6;            /* surface.brand.brand-intense-pressed · brand/700 */
  --btn-accent-raised: 0 6px 14px -4px rgba(26, 86, 255, .45);    /* elevation.brand.raised — at rest */
  --btn-accent-lifted: 0 16px 40px -12px rgba(26, 86, 255, .40);  /* elevation.brand.lifted — hover */
  --btn-accent-subtle: 0 8px 24px -10px rgba(26, 86, 255, .18);   /* elevation.brand.subtle — pressed */
  --btn-none: 0 0 #0000;                    /* "no shadow" that can sit in a box-shadow list */
  /* SHAPE · SPACE · TYPE — §2.1 / §2.3 / §2.4 */
  --btn-radius: 12px;                       /* size.radius.lg — every action button */
  --btn-stroke-w: 1.5px;                    /* size.stroke.default — outlined edge */
  --btn-gap: 8px;                           /* spacing.inline.md — icon ↔ label */
  --btn-font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;   /* typeface.family.brand */
  --btn-dur: 150ms;                         /* motion — proposed */

  /* size md (default) — A.02 */
  --_h: 44px;                               /* size.control.md */
  --_px: 16px;                              /* spacing.inset.xl */
  --_fs: 12px; --_lh: 12px;                 /* Label / md bold */
  --_ic: 16px;                              /* size.icon.md */
  --_ic-only: 20px;                         /* size.icon.lg — icon-only glyph */
  /* type primary (default) */
  --_bg: var(--btn-inverse); --_fg: var(--btn-on-fill); --_bd: transparent;
  --_bg-h: var(--btn-inverse-hover); --_bg-p: var(--btn-inverse-pressed);
  --_sh: var(--btn-none);                   /* rest elevation — none, except the accent's glow */
  --_sh-h: var(--btn-lifted); --_sh-p: var(--btn-raised-sh); --_lift: translateY(-1px);
  --_edge: inset 0 0 0 var(--btn-stroke-w) var(--_bd);   /* the edge: an inset shadow (size.stroke.default) */

  position: relative; box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--btn-gap);
  height: var(--_h); min-width: var(--_h); margin: 0; padding: 0 var(--_px);
  border: 0; border-radius: var(--btn-radius);
  background: var(--_bg); color: var(--_fg); box-shadow: var(--_edge), var(--_sh);
  font: 700 var(--_fs)/var(--_lh) var(--btn-font); letter-spacing: 0; text-align: center; text-decoration: none; white-space: nowrap;
  cursor: pointer; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  transition: background-color var(--btn-dur), color var(--btn-dur), box-shadow var(--btn-dur), transform var(--btn-dur);
}
/* icons bring their own drawing (the app's icon markup: stroke icons fill="none" stroke="currentColor"; solid icons
   fill="currentColor"); the atom only sizes them, colours them through currentColor and sets the stroke weight */
.btn > svg { display: block; flex: none; width: var(--_ic); height: var(--_ic); }
.btn > svg:not([stroke-width]) { stroke-width: 2px; }   /* size.stroke.thick — an icon that sets its own weight keeps it */

/* ── Sizes (A.02.4) ─────────────────────────────────────────────── */
.btn--sm { --_h: 40px; --_px: 16px; --_fs: 12px; --_lh: 12px; --_ic: 14px; --_ic-only: 16px; }   /* size.control.sm · inset.xl · Label/md · icon.sm (icon only: icon.md) */
.btn--md { --_h: 44px; --_px: 16px; --_fs: 12px; --_lh: 12px; --_ic: 16px; --_ic-only: 20px; }   /* size.control.md · inset.xl · Label/md · icon.md */
.btn--lg { --_h: 48px; --_px: 22px; --_fs: 14px; --_lh: 14px; --_ic: 16px; --_ic-only: 20px; }   /* size.control.lg · inset.xxl · Label/lg · icon.md */
.btn--xl { --_h: 56px; --_px: 22px; --_fs: 14px; --_lh: 14px; --_ic: 16px; --_ic-only: 20px; }   /* size.control.xl · inset.xxl · Label/lg · icon.md */

/* ── Types × tones ──────────────────────────────────────────────── */
/* 1 · Primary — the one main action of a region */
.btn--primary { --_bg: var(--btn-inverse); --_fg: var(--btn-on-fill); --_bd: transparent;
  --_bg-h: var(--btn-inverse-hover); --_bg-p: var(--btn-inverse-pressed); --_sh-h: var(--btn-lifted); --_sh-p: var(--btn-raised-sh); --_lift: translateY(-1px); }
.btn--primary.btn--destructive { --_bg: var(--btn-neg); --_fg: var(--btn-on-intense);
  --_bg-h: var(--btn-neg-hover); --_bg-p: var(--btn-neg-hover); }   /* pressed = hover colour + raised (bottom sheet today) */
/* 1b · Primary · accent — THE EXCEPTION: brand blue with a blue glow at rest (A.02 Primary · Brand). Search only —
   the top bar's Search Jobs; every other primary is black. It glows instead of moving: no lift on hover */
.btn--primary.btn--accent { --_bg: var(--btn-accent); --_fg: var(--btn-on-intense);
  --_bg-h: var(--btn-accent-hover); --_bg-p: var(--btn-accent-pressed);
  --_sh: var(--btn-accent-raised); --_sh-h: var(--btn-accent-lifted); --_sh-p: var(--btn-accent-subtle); --_lift: none; }
/* 2 · Secondary — outlined: the alternative next to a primary. Hover lifts and presses like Primary (A.02.5 — one
   motion for Primary and Secondary; Muted and Link stay flat) */
.btn--secondary { --_bg: var(--btn-base); --_fg: var(--btn-ink); --_bd: var(--btn-stroke);
  --_bg-h: var(--btn-state-hover); --_bg-p: var(--btn-state-pressed); }
.btn--secondary.btn--destructive { --_fg: var(--btn-neg-text); --_bd: var(--btn-neg-stroke);
  --_bg-h: var(--btn-neg-subtle); --_bg-p: var(--btn-neg-subtle-hover); }
/* 3 · Muted — tinted fill, no edge: quiet actions and the bar's pills (menu, back, status). Flat (v1.3.0): only the
   fill changes on hover / press — it never lifts, so bar buttons don't jump under the finger */
.btn--muted { --_bg: var(--btn-muted); --_fg: var(--btn-ink); --_bd: transparent;
  --_bg-h: var(--btn-state-pressed); --_bg-p: var(--btn-state-pressed); --_sh-h: var(--btn-none); --_sh-p: var(--btn-none); --_lift: none; }
.btn--muted.btn--destructive { --_bg: var(--btn-neg-subtle); --_fg: var(--btn-neg-text);
  --_bg-h: var(--btn-neg-subtle-hover); --_bg-p: var(--btn-neg-subtle-hover); }
/* 4 · Link — text only, the lowest weight; padding 12 so the tap area stays a button. Hover and pressed share one
   tint (A.02 Ghost; the Profile icon buttons and the sheet's ghost button today) */
.btn--link { --_bg: transparent; --_fg: var(--btn-ink); --_bd: transparent; --_px: 12px;   /* spacing.inset.lg (A.02 tertiary) */
  --_bg-h: var(--btn-state-hover); --_bg-p: var(--btn-state-hover); --_sh-h: var(--btn-none); --_sh-p: var(--btn-none); --_lift: none; }
.btn--link.btn--destructive { --_fg: var(--btn-neg-text);
  --_bg-h: var(--btn-neg-subtle); --_bg-p: var(--btn-neg-subtle); }

/* ── States (A.02.5) — hover on pointer devices only; data-state shows a state in the guidelines ── */
@media (hover: hover) {
  .btn:hover:not(:active):not(:disabled):not([aria-disabled="true"]):not([aria-busy="true"]) {
    background: var(--_bg-h); box-shadow: var(--_edge), var(--_sh-h); transform: var(--_lift);
  }
}
.btn[data-state="hover"] { background: var(--_bg-h); box-shadow: var(--_edge), var(--_sh-h); transform: var(--_lift); }
.btn:active:not(:disabled):not([aria-disabled="true"]):not([aria-busy="true"]),
.btn[data-state="pressed"] { background: var(--_bg-p); box-shadow: var(--_edge), var(--_sh-p); transform: none; }
.btn:focus { outline: none; }
.btn:focus-visible, .btn[data-state="focus"] {   /* stroke.neutral.focus outline + elevation.focus.default ring; the edge stays */
  outline: 2px solid var(--btn-focus); outline-offset: 2px; box-shadow: var(--_edge), var(--btn-ring);
}
.btn:disabled, .btn[aria-disabled="true"] {
  --_bd: transparent; background: var(--btn-disabled-bg); color: var(--btn-disabled-fg);
  box-shadow: var(--_edge); transform: none; cursor: default; pointer-events: none;
}
.btn--secondary:disabled, .btn--secondary[aria-disabled="true"] { --_bd: var(--btn-disabled-bg); background: transparent; }
.btn--link:disabled, .btn--link[aria-disabled="true"] { background: transparent; }

/* loading — keep the label, add a spinner in front; the button stays its size */
.btn[aria-busy="true"] { cursor: progress; pointer-events: none; }
.btn-spinner {
  flex: none; width: var(--_ic); height: var(--_ic); box-sizing: border-box; border-radius: 1024px;   /* size.radius.full */
  border: 2px solid currentColor; border-right-color: transparent; animation: btn-spin 700ms linear infinite;
}
@keyframes btn-spin { to { transform: rotate(360deg); } }

/* ── Icon only — square, glyph only (aria-label required) ───────── */
.btn--icon { width: var(--_h); padding: 0; }
.btn--icon > svg { width: var(--_ic-only); height: var(--_ic-only); }
/* A.02 Icon-only: the glyph is content.neutral.muted on Secondary and Link (share, save, edit, ⋮, +). Muted keeps
   content.neutral.base — its fill already says "button", and menu / back are primary navigation */
.btn--icon:not(.btn--primary):not(.btn--destructive):not(.btn--muted) { --_fg: var(--btn-ink-muted); }
/* navigation glyph (menu, back): size.icon.lg 20 at every size — action glyphs (save, share, +) keep the size's own */
.btn--icon.btn--icon-lg { --_ic-only: 20px; }
.btn--icon[aria-busy="true"] svg { display: none; }                   /* loading: the spinner replaces the glyph */
.btn--icon .btn-spinner { width: var(--_ic-only); height: var(--_ic-only); }

/* toggle on (e.g. bookmark saved) — the app's "selected" pair, any type except primary */
.btn[aria-pressed="true"]:not(.btn--primary) {
  --_bg: var(--btn-brand-subtle); --_fg: var(--btn-brand); --_bd: var(--btn-brand-subtle);
  --_bg-h: var(--btn-brand-subtle); --_bg-p: var(--btn-brand-subtle);
}
.btn[aria-pressed="true"]:not(.btn--primary) > svg { fill: currentColor; }

/* ── Layout and shape ───────────────────────────────────────────── */
.btn--block { display: flex; width: 100%; }
.btn--fill { flex: 1 1 0; min-width: 0; --_px: 12px; }   /* shares a row with other buttons: label centred, padding spacing.inset.lg */
@media (max-width: 359px) { .btn--fill.btn--lg, .btn--fill.btn--xl { --_px: 8px; --_fs: 12px; --_lh: 12px; } }   /* two labels fit on 320 phones */
.btn--pill { border-radius: 1024px; }      /* size.radius.full — bar / navigation buttons only (README › Pill buttons) */
/* Link only: the text (or glyph) lines up with the content edge — the button's padding hangs outside it */
.btn--link.btn--flush { margin-inline: calc(var(--_px) * -1); }
.btn--link.btn--icon.btn--flush { margin: calc((var(--_ic-only) - var(--_h)) / 2); }
/* a trailing badge (A.04, e.g. +22 on Upload resume) sits 12 from the label (spacing.inline.lg) */
.btn > .badge { margin-left: 4px; }

/* on a permanently dark surface (the Profile hero, the dark top bar over it): white fill, black text — in both
   themes. Primary (Upload resume) and Muted (the bar's status pill) take it; on Muted it is the resting fill that
   reads on dark, so the role (quiet choice) stays the same while the surface changes */
.btn--primary.btn--on-dark, .btn--muted.btn--on-dark { --_bg: var(--btn-on-dark-bg); --_fg: var(--btn-on-dark-fg); --_bg-h: var(--btn-on-dark-hover); --_bg-p: var(--btn-on-dark-pressed); --btn-focus: var(--btn-on-dark-focus); }

/* ── Dark theme — the dark column of §2.2 (App-login pages are light-only today) ── */
[data-theme="dark"] .btn {
  --btn-inverse: #FAF9F6;                   /* surface.inverse.base · warm-100 */
  --btn-inverse-hover: #EEF1F5;             /* surface.inverse-state.hover · cool-100 */
  --btn-inverse-pressed: #E4E7EC;           /* surface.inverse-state.pressed · cool-200 */
  --btn-on-fill: #0D1117;                   /* A.02: primary text in dark = content.inverse.base · black */
  --btn-ink: #F7F9FB;                       /* content.neutral.base · cool-50 */
  --btn-ink-muted: #C8CED7;                 /* content.neutral.muted · cool-300 */
  --btn-base: #0D1117;                      /* surface.neutral.base · black */
  --btn-muted: #161B22;                     /* surface.neutral.muted · cool-900 */
  --btn-state-hover: #344054;               /* surface.neutral-state.hover · cool-700 */
  --btn-state-pressed: #4A5260;             /* surface.neutral-state.pressed · cool-600 */
  --btn-stroke: #4A5260;                    /* stroke.neutral.base · cool-600 */
  --btn-neg-text: #FCA5A0;                  /* content.status.negative · red-300 */
  --btn-neg-stroke: #F87171;                /* stroke.status.negative · red-400 */
  --btn-neg-subtle: #1C0404;                /* surface.status.negative-subtle · red-950 */
  --btn-neg-subtle-hover: #380808;          /* proposed · red-900 */
  --btn-brand-subtle: #06184F;              /* surface.brand.brand-subtle · brand-900 */
  --btn-brand: #7EA3FF;                     /* content.neutral.brand · brand-300 */
  --btn-disabled-bg: rgba(255, 255, 255, .08); /* stroke.neutral.disabled · white-25 */
  --btn-disabled-fg: rgba(255, 255, 255, .36); /* content.neutral.disabled · white-75 */
  --btn-focus: #7EA3FF;                     /* stroke.neutral.focus · brand-300 */
  --btn-lifted: 0 4px 12px rgba(13, 17, 23, .45), 0 2px 4px rgba(13, 17, 23, .30);   /* elevation.neutral.lifted (dark α) */
  --btn-raised-sh: 0 1px 3px rgba(13, 17, 23, .40), 0 1px 2px rgba(13, 17, 23, .25); /* elevation.neutral.raised (dark α) */
  --btn-ring: 0 0 0 4px rgba(26, 86, 255, .20);                                       /* elevation.focus.default (dark α) */
  --btn-accent-raised: 0 6px 14px -4px rgba(26, 86, 255, .55);    /* elevation.brand.raised (dark α) */
  --btn-accent-lifted: 0 16px 40px -12px rgba(26, 86, 255, .50);  /* elevation.brand.lifted (dark α) */
  --btn-accent-subtle: 0 8px 24px -10px rgba(26, 86, 255, .30);   /* elevation.brand.subtle (dark α) */
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  .btn:hover, .btn[data-state="hover"] { transform: none !important; }
  .btn-spinner { animation-duration: 1.6s; }
}

/* page */
*, *::before, *::after { box-sizing: border-box; } * { margin: 0; }

html[data-env="safari"] [data-show]:not([data-show~="safari"], [data-show~="ios"], [data-show~="mobile"]) { display: none !important; }
html[data-env="ios-other"] [data-show]:not([data-show~="ios-other"], [data-show~="ios"], [data-show~="mobile"], [data-show~="not-safari"]) { display: none !important; }

html[data-env="desktop"] [data-show]:not([data-show~="desktop"], [data-show~="not-safari"]) { display: none !important; }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 50; transform: translate(-50%, 16px); opacity: 0;
  padding: 10px 16px; border-radius: var(--size-radius-full); background: var(--surface-inverse-base); color: var(--content-on-fill-dark-base);
  font-size: var(--type-body-md-size); line-height: var(--type-body-md-lh); font-weight: var(--typeface-weight-semibold);

:root { --land-night: #0C1731; }   /* the splash's midnight navy (splash.html, launch images) — the app's documented splash exception */
html, body { background: var(--land-night); }

/* sky: the splash's sunrise glow + two shooting stars, once */
.sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.sky::after { content: ""; position: absolute; left: 50%; bottom: -46vh; width: 170vw; height: 90vh; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c-brand-300) 34%, transparent), color-mix(in srgb, var(--c-brand-500) 12%, transparent) 45%, transparent 72%);
  animation: rise 2.4s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { transform: translate(-50%, 30%); opacity: 0; } }
.star { position: absolute; width: 140px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--c-cn-white)); opacity: 0; }
.star--a { top: 12%; left: -30%; transform: rotate(18deg); animation: shoot 1.4s .3s ease-out both; }
.star--b { top: 20%; right: -30%; transform: rotate(162deg); animation: shoot2 1.4s .5s ease-out both; }
@keyframes shoot { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; left: 70%; } }
@keyframes shoot2 { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; right: 70%; } }

/* layout: hero fills the space above · steps · actions at the bottom (24 gutter) */
.wrap { position: relative; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding: max(var(--spacing-section-lg), calc(env(safe-area-inset-top) + var(--spacing-section-md))) var(--spacing-layout-sm)
           max(var(--spacing-section-md), calc(env(safe-area-inset-bottom) + var(--spacing-section-xs))); }
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--spacing-section-lg) 0 48px; }
.halo { position: relative; }
.halo::before { content: ""; position: absolute; inset: -32px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c-brand-400) 40%, transparent), transparent); }
.app-ic { position: relative; width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 24px 48px -16px rgba(0, 0, 0, .6);
  animation: pop .7s .2s cubic-bezier(.32, 1.4, .5, 1) both; }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
h1 { margin-top: var(--spacing-section-lg); font-size: var(--type-display-md-size); line-height: var(--type-display-md-lh); letter-spacing: var(--type-display-md-ls); font-weight: var(--typeface-weight-extrabold); }

/* steps: three glass circles joined by a hairline, label under each */
.steps { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
.step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 var(--spacing-inline-sm); }
.step + .step::before { content: ""; position: absolute; top: 26px; right: calc(50% + 34px); width: calc(100% - 68px); height: 1px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .28)); }
.step .ic { position: relative; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; color: var(--content-on-fill-dark-base);
  background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
.step .ic svg { width: 22px; height: 22px; }
.step .ic i { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font-style: normal;
  background: var(--c-cn-white); color: var(--land-night); font-size: var(--type-label-sm-size); font-weight: var(--typeface-weight-extrabold); }
.step b { margin-top: var(--spacing-stack-md); font-size: var(--type-body-md-size); line-height: var(--type-body-md-lh); font-weight: var(--typeface-weight-semibold); }

.note { margin-top: var(--spacing-section-xs); padding: var(--spacing-inset-lg) var(--spacing-inset-xl); border-radius: var(--size-radius-lg); background: rgba(255, 255, 255, .08); text-align: center;
  font-size: var(--type-body-md-size); line-height: var(--type-body-md-lh); color: var(--content-on-fill-dark-base); font-weight: var(--typeface-weight-medium); }
.note b { font-weight: var(--typeface-weight-extrabold); }

/* actions: one button group (8 apart), 32 below the steps */
.actions { margin-top: var(--spacing-section-lg); display: grid; gap: var(--spacing-stack-xs); }
.btn--link.alt { color: var(--content-on-fill-dark-base); }
