<script data-ios-nozoom>
  /* iOS Safari auto-zooms the page when a focused field's text is under 16px
     (search modal, filter search). Adding maximum-scale=1 on iOS / iPadOS only
     stops that auto-zoom without touching the design. Pinch-to-zoom still works
     (iOS ignores scale limits for user gestures since iOS 10), and Android —
     which never auto-zooms — keeps its viewport untouched. */
  (function () {
    var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS "desktop" mode
    var m = document.querySelector('meta[name="viewport"]');
    if (iOS && m && !/maximum-scale/.test(m.content)) m.content += ', maximum-scale=1';
  })();
</script>

    s.f = {};

    var n = 1200 + (h % 42000); return s.exp ? Math.round(n * 0.38) : n;
  }
  function paint(s){
    var q = document.getElementById('jsrpMHeroQuery'), l = document.getElementById('jsrpMHeroLocation');
    var c = document.getElementById('jsrpMStickyCountNum'), pill = document.getElementById('jsrpMStickyCount');
    if (q) q.textContent = s.q || 'All';
    if (l) l.textContent = s.loc || 'India';
    if (c) c.textContent = (window.__jsrpCount ? window.__jsrpCount(s) : countFor(s)).toLocaleString('en-IN');
    if (pill) {
      var x = pill.querySelector('.jsrp-m-hero-exp');
      if (s.exp) { if (!x) { x = document.createElement('span'); x.className = 'jsrp-m-hero-exp'; pill.appendChild(x); } x.textContent = s.exp; }
      else if (x) x.remove();
    }
    document.title = (s.q || 'All') + ' jobs in ' + (s.loc || 'India') + ' — Shine';
  }
  window.__jsrpState = fromUrl();
  window.__jsrpUrl = toUrl;
  window.__jsrpPaint = paint;
  window.__jsrpBaseCount = countFor;
  paint(window.__jsrpState);

  document.addEventListener('DOMContentLoaded', function(){
    // Edit search submit on this page → update in place (no reload), keep history.
    // A new search starts clean: Relevance + no filters (sort-filter component reset silently).
    document.addEventListener('shine:search', function(e){
      if (e.detail.source !== 'jsrp') return;          // any other trigger keeps the component default
      e.preventDefault();
      var cur = window.__jsrpState;
      var s = { q: e.detail.query, loc: e.detail.location, exp: e.detail.experience, sort: DEFAULT_SORT, f: {} };
      var same = s.q === cur.q && s.loc === cur.loc && s.exp === cur.exp;
      if (same) { s.sort = cur.sort; s.f = cur.f; }
      else if (window.__jsrpSF) window.__jsrpSF.reset({ silent: true });
      window.__jsrpState = s; paint(s);
      if (!same) history.pushState(s, '', toUrl(s));
      if (window.__jsrpReload) window.__jsrpReload(s);
      if (typeof showToast === 'function') showToast(same ? 'Showing the same search' : 'Search updated');
    });
    window.addEventListener('popstate', function(){
      var s = window.__jsrpState = fromUrl();
      if (window.__jsrpSF) window.__jsrpSF.setState({ sort: s.sort, filters: s.f }, { silent: true });
      paint(s);
      if (window.__jsrpReload) window.__jsrpReload(s);
    });
    // Back: previous app screen when there is one, otherwise the logged-out home.
    var back = document.getElementById('jsrpMNavBack');
    back && back.addEventListener('click', function(){
      var internal = document.referrer && document.referrer.indexOf(location.origin) === 0 && location.protocol !== 'file:';
      if (internal && history.length > 1) history.back(); else location.href = HOME;
    });
  });
})();

<script>
    // === Toast ===
    // toasts come from the shared notify component (App-logout/app-components/notify)
    function showToast(msg, tone) {
      if (window.ShineNotify) window.ShineNotify.toast(msg, { tone: tone || 'neutral' });
    }
    // lift toasts above the floating Sort · Filter bar (bar: 20 px from the bottom, 48 px tall, + 12 px gap)
    if (window.ShineNotify) window.ShineNotify.configure({ toastBottom: 80 });
    else document.addEventListener('DOMContentLoaded', function () { if (window.ShineNotify) window.ShineNotify.configure({ toastBottom: 80 }); });

    (function setupAuthNudge(){
      var share       = document.getElementById('nudgeShare');
      var shareSh     = document.getElementById('nudgeShareSheet');
      // Save (bookmark) nudge — desktop dialog + mobile sheet.
      // Shown ONLY when a logged-out user taps the bookmark on a job card.
      var saveModal   = document.getElementById('nudgeSave');
      var saveSheet   = document.getElementById('nudgeSaveSheet');
      if (!window.ShineSheet) return;

      // Tracks the currently-open modal element so close() knows what
      // to dismiss. Could be either the desktop dialog or mobile sheet.
      var currentOpen = null;

      function isMobile() {
        return window.matchMedia('(max-width: 767px)').matches;
      }
      function pickModal(kind) {
        // Returns the right modal element for the current viewport.
        // 'share' → share modal / sheet. 'save' → save modal / sheet.
        if (kind === 'share') return shareSh;
        if (kind === 'save')  return saveSheet;
        return null;
      }
      function openNudge(kind, trigger) {
        var el = pickModal(kind);
        if (!el) return;
        currentOpen = el;
        // scrim, scroll lock, focus, Escape, drag-to-dismiss → shared bottom-sheet component
        window.ShineSheet.open(el, { trigger: trigger });
      }
      function closeNudge() {
        if (!currentOpen) return;
        var el = currentOpen; currentOpen = null;
        window.ShineSheet.close(el, 'api');
      }
      [shareSh, saveSheet].forEach(function(sh){
        sh && sh.addEventListener('shine:sheet-close', function(e){ if (e.target === sh && currentOpen === sh) currentOpen = null; });
      });

      // ── Share sheet handlers ──────────────────────────────────────
      // Replaces the old "refer & earn" 3-state flow. Each channel
      // button opens the platform-specific share URL in a new tab;
      // the Copy button writes the job URL to clipboard.
      function getShareContext(modal) {
        var input = modal && modal.querySelector('[data-share-url]');
        var url   = input ? input.value : (location.origin + location.pathname);
        var title = 'Product Manager jobs on Shine.com';
        var text  = 'Check out this role on Shine.com — ';
        return { url: url, title: title, text: text };
      }
      var SHARE_URLS = {
        linkedin: function(c){ return 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(c.url); },
        twitter:  function(c){ return 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(c.text) + '&url=' + encodeURIComponent(c.url); },
        facebook: function(c){ return 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(c.url); },
        email:    function(c){ return 'mailto:?subject=' + encodeURIComponent(c.title) + '&body=' + encodeURIComponent(c.text + c.url); },
        whatsapp: function(c){ return 'https://wa.me/?text=' + encodeURIComponent(c.text + c.url); }
      };
      document.querySelectorAll('[data-share]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          var channel = btn.getAttribute('data-share');
          var modal   = btn.closest('.nudge-modal--share, .jsrp-m-nudge-sheet');
          var ctx     = getShareContext(modal);
          if (channel === 'copy') {
            try {
              navigator.clipboard && navigator.clipboard.writeText(ctx.url);
              btn.classList.add('is-copied');
              var lbl = btn.querySelector('.share-copy-btn-lbl');
              var prev = lbl ? lbl.textContent : '';
              if (lbl) lbl.textContent = 'Copied!';
              setTimeout(function(){
                btn.classList.remove('is-copied');
                if (lbl) lbl.textContent = prev || 'Copy';
              }, 1600);
            } catch (_) {
              if (typeof showToast === 'function') showToast('Couldn’t copy the link', 'error');
            }
            if (typeof showToast === 'function') showToast('Job link copied', 'success');
            return;
          }
          var buildUrl = SHARE_URLS[channel];
          if (!buildUrl) return;
          window.open(buildUrl(ctx), '_blank', 'noopener,noreferrer');
          // Close the sheet after the channel opens so the user
          // returns to the results view.
          setTimeout(closeNudge, 150);
        });
      });

      // BOOKMARK-modal CTA wiring (signup / login) — kept so the save
      // nudge still works. The old share-modal CTAs (`generate`,
      // `how-it-works`, `whatsapp`, `copy-link`, `how-back`) were
      // removed alongside the refer-earn UI.
      document.querySelectorAll('[data-nudge-cta]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          var act = btn.getAttribute('data-nudge-cta');
          if (act === 'signup' || act === 'login') {
            closeNudge();
            setTimeout(function(){ if (typeof showToast === 'function') showToast('Opens login'); }, 200);
          }
        });
      });

      // ── Trigger wiring on the job cards ───────────────────────────
      // Desktop bookmark button is in the toolbar (.jd-save), not on
      // the card. Share button IS on each card (.jd-jc-share).
      //
      // We hook into the existing click delegation by intercepting
      // [data-act="share"] and [data-act="bookmark"] BEFORE the
      // default toast handler fires. The existing handlers stay in
      // place as fallbacks if this modal isn't wired (e.g. logged-in
      // state for bookmark — though we override that too).
      // Intercept share clicks BEFORE the default toast handler fires
      // (capture-phase). The original delegated bubble-phase handlers
      // stay as fallbacks.
      //
      // Save / bookmark: logged-OUT users get the register/login nudge
      // and the bubble-phase toggle is suppressed via stopImmediatePropagation.
      // Logged-IN users fall through to the bubble-phase handler that
      // actually toggles .is-saved on the button. This mirrors the exact
      // contract used on company-index1.html.
      function handleCardClick(e) {
        var t = e.target;
        var shareBtn = t.closest('[data-act="share"]');
        if (shareBtn) {
          e.stopImmediatePropagation();
          openNudge('share', shareBtn);
          return;
        }
        var saveBtn = t.closest('[data-act="save"]');
        if (saveBtn && !document.body.classList.contains('is-logged-in')) {
          e.stopImmediatePropagation();
          openNudge('save', saveBtn);
        }
      }
      // Bind in CAPTURE phase so we run before the existing delegated
      // bubble-phase handlers.
      var jdList = document.getElementById('jdList');
      if (jdList) jdList.addEventListener('click', handleCardClick, true);
      var jsrpMList = document.getElementById('jsrpMList');
      if (jsrpMList) jsrpMList.addEventListener('click', handleCardClick, true);

      // Save-nudge CTAs — Register (primary) opens the sign-up flow;
      // Log in (secondary) runs the existing login simulation. Both close
      // the nudge first so the modal isn't hanging in front of the user
      // after they've committed. Ported from company-index1.html.
      [saveModal, saveSheet].forEach(function(m){
        if (!m) return;
        m.querySelectorAll('[data-save-cta]').forEach(function(btn){
          btn.addEventListener('click', function(){
            var act = btn.getAttribute('data-save-cta');
            closeNudge();
            if (act === 'login') {
              setTimeout(function(){ if (typeof showToast === 'function') showToast('Opens login'); }, 220);
            } else {
              // Register → placeholder toast until the real signup flow lands.
              if (typeof showToast === 'function') showToast('Opens registration');
            }
          });
        });
      });

      // Expose for future deep links (e.g. open share from URL param)
      window.__openNudge = openNudge;
    })();


</script>

      function mobileToolsPromoHTML(){
        var cards = MOBILE_TOOLS_DATA.map(function(t, i){
          return '<article class="jd-tools-promo-card"' +
            ' data-tool="' + t.tool + '"' +
            ' data-idx="' + i + '"' +
            ' data-pos="' + i + '"' +
            ' data-label="' + t.label + '"' +
            ' aria-label="' + t.label + ' — ' + t.alt + '">' +
            '<img src="' + t.img + '" alt="' + t.alt + '" />' +
          '</article>';
        }).join('');
        var dots = MOBILE_TOOLS_DATA.map(function(_, i){
          return '<button type="button" class="jd-tools-promo-dot' + (i === 0 ? ' is-on' : '') + '" data-dot="' + i + '" aria-label="Go to tool ' + (i+1) + '"></button>';
        }).join('');
        return '<article class="jd-tools-promo" data-tools-promo>' +
          '<div class="jd-tools-promo-text">' +
            '<h3 class="jd-tools-promo-h">Apply smarter. Interview <span class="accent">stronger.</span></h3>' +
            '<p class="jd-tools-promo-sub">Tools which help you find your interview odds, fair-pay range, and the answers recruiters look for.</p>' +
          '</div>' +
          '<div class="jd-tools-promo-visual">' +
            '<div class="jd-tools-promo-stage" data-tools-stage>' + cards + '</div>' +
            '<div class="jd-tools-promo-dots" data-tools-dots>' + dots + '</div>' +
          '</div>' +
        '</article>';
      }
      function wireMobileToolsPromo(){
        if (!listEl) return;
        var promo = listEl.querySelector('[data-tools-promo]');
        if (!promo) return;
        var stage = promo.querySelector('[data-tools-stage]');
        var cards = Array.prototype.slice.call(stage.querySelectorAll('.jd-tools-promo-card'));
        if (cards.length < 2) return;
        var dots = Array.prototype.slice.call(promo.querySelectorAll('[data-tools-dots] .jd-tools-promo-dot'));

        var THRESHOLD = 80;   // px to commit a swipe
        var dragging = false;
        var startX = 0;
        var dx = 0;
        var front = null;
        var pointerId = null;
        var moved = false;    // distinguish drag from tap

        function getFront(){
          for (var i = 0; i < cards.length; i++) {
            if (cards[i].getAttribute('data-pos') === '0') return cards[i];
          }
          return null;
        }
        function syncDots(){
          var f = getFront();
          if (!f) return;
          var idx = cards.indexOf(f);
          dots.forEach(function(d, i){ d.classList.toggle('is-on', i === idx); });
        }
        function cycleStack(){
          // Shift every card one position back (front → back of deck)
          var max = cards.length - 1;
          cards.forEach(function(c){
            var p = parseInt(c.getAttribute('data-pos'), 10);
            if (isNaN(p)) p = 0;
            c.setAttribute('data-pos', String(p === 0 ? max : p - 1));
          });
          syncDots();
        }
        function setActive(targetIdx){
          cards.forEach(function(c, i){
            var rel = (i - targetIdx + cards.length) % cards.length;
            c.setAttribute('data-pos', String(rel));
          });
          syncDots();
        }

        function onDown(e){
          front = getFront();
          if (!front) return;
          // Ignore if the press started over a link/button INSIDE the card
          if (e.target.closest && e.target.closest('a, button.jd-tools-promo-dot')) return;
          // Ignore if the press started over a non-front card (peek edges)
          if (!front.contains(e.target) && e.target !== front) return;
          dragging = true;
          moved = false;
          startX = (e.touches ? e.touches[0].clientX : e.clientX);
          dx = 0;
          front.classList.add('dragging');
          // Pointer capture keeps move/up events flowing even if the
          // finger leaves the card bounds.
          if (e.pointerId !== undefined && front.setPointerCapture) {
            try { front.setPointerCapture(e.pointerId); pointerId = e.pointerId; } catch (_) {}
          }
          if (e.cancelable) e.preventDefault();
        }
        function onMove(e){
          if (!dragging || !front) return;
          var x = (e.touches ? e.touches[0].clientX : e.clientX);
          dx = x - startX;
          if (Math.abs(dx) > 4) moved = true;
          var rot = dx * 0.05;
          front.style.transform = 'translate3d(' + dx + 'px, 0, 0) rotate(' + rot + 'deg)';
          if (e.cancelable) e.preventDefault();
        }
        function onUp(){
          if (!dragging || !front) { dragging = false; return; }
          dragging = false;
          var card = front;
          card.classList.remove('dragging');
          if (pointerId !== null && card.releasePointerCapture) {
            try { card.releasePointerCapture(pointerId); } catch (_) {}
          }
          pointerId = null;
          if (Math.abs(dx) >= THRESHOLD) {
            // Fling animation, then cycle the deck
            var dir = dx < 0 ? -1 : 1;
            card.style.transform = 'translate3d(' + (dir * 480) + 'px, 0, 0) rotate(' + (dir * 14) + 'deg)';
            card.style.opacity = '0';
            setTimeout(function(){
              cycleStack();
              card.style.transform = '';
              card.style.opacity = '';
            }, 320);
          } else {
            // Snap back
            card.style.transform = '';
          }
          dx = 0;
          front = null;
        }
        function onTap(e){
          // Tap (not drag) on the active card → open the tool
          if (moved) return;
          var card = e.target.closest('.jd-tools-promo-card');
          if (!card || card.getAttribute('data-pos') !== '0') return;
